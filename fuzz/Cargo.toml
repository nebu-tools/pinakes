[package]
name = "pinakes-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pinakes = { path = "../crates/pinakes" }

# Kept out of the main workspace: it needs nightly and cargo-fuzz.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "read_ris"
path = "fuzz_targets/read_ris.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_bibtex"
path = "fuzz_targets/read_bibtex.rs"
test = false
doc = false
bench = false

