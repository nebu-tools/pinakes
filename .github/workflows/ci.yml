name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Build on Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pinakes -p pinakes-cli

  wasm:
    name: WebAssembly build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - run: sh bindings/wasm/build.sh
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - name: Size of the module
        run: |
          wasm=bindings/wasm/pkg/pinakes_wasm_bg.wasm
          echo "raw $(wc -c < "$wasm") bytes, gzip $(gzip -9 -c "$wasm" | wc -c) bytes"
      - working-directory: bindings/wasm
        run: node --test test/
      - working-directory: bindings/wasm
        run: bun test
      - working-directory: bindings/wasm
        run: npx -y -p typescript@5.9.3 tsc -p .

  python:
    name: Python wheel build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "maturin>=1.7,<2" pytest
      - run: maturin build --release --manifest-path bindings/python/Cargo.toml --out dist
      - run: ls -l dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest bindings/python/tests -q
